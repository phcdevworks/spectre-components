name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22.x
          - 24.x

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json

      # The lockfile is written by the npm pinned in package.json
      # "packageManager"; npm 10 (bundled with Node 22) rejects it. Install
      # into a separate prefix: upgrading the bundled npm in place can break
      # mid-install.
      - name: Install pinned npm
        run: |
          npm install -g --prefix "$RUNNER_TEMP/npm" "$(node -p "require('./package.json').packageManager")"
          echo "$RUNNER_TEMP/npm/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: npm ci

      - name: Run validation suite
        run: npm run check

  browser:
    name: Browser behavior
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install pinned npm
        run: |
          npm install -g --prefix "$RUNNER_TEMP/npm" "$(node -p "require('./package.json').packageManager")"
          echo "$RUNNER_TEMP/npm/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: npm ci

      - name: Install browser and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run browser behavior tests
        run: npm run test:browser
